<!doctype html>
<html lang="en">
<head>
<!-- BUILD:HEAD-START -->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Food Group Log</title>
<meta name="description" content="Log which of 13 food groups you eat each day. No account, no server — everything stays in this browser.">
<meta name="theme-color" content="#001A00">
<meta name="color-scheme" content="light dark">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Food Groups">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="css/styles.css">
<script>
/* Apply the saved theme before first paint, so the page never flashes the wrong one. */
(function () {
  try {
    var raw = localStorage.getItem('foodGroupLog.settings');
    var theme = raw ? (JSON.parse(raw) || {}).theme : 'system';
    if (theme === 'light' || theme === 'dark') {
      document.documentElement.setAttribute('data-theme', theme);
    }
  } catch (err) {}
})();
</script>
<!-- BUILD:HEAD-END -->
</head>
<body>
<!-- BUILD:BODY-START -->
<a class="skip-link" href="#main">Skip to content</a>

<header class="topbar">
  <a class="brand" href="#today" data-nav-brand>
    <span class="brand-mark" aria-hidden="true"><span data-icon="leaf" data-size="18"></span></span>
    <span class="brand-name">Food Group Log</span>
  </a>

  <nav class="tabs" aria-label="Main">
    <a href="#today" data-tab="today"><span data-icon="home" data-size="18"></span><span class="tab-label">Today</span></a>
    <a href="#calendar" data-tab="calendar"><span data-icon="calendar" data-size="18"></span><span class="tab-label">Calendar</span></a>
    <a href="#analytics" data-tab="analytics"><span data-icon="chart" data-size="18"></span><span class="tab-label">Analytics</span></a>
    <a href="#preferences" data-tab="preferences"><span data-icon="sliders" data-size="18"></span><span class="tab-label">Settings</span></a>
  </nav>

  <button type="button" class="icon-btn topbar-toggle" id="theme-toggle" aria-label="Switch theme"></button>
</header>

<main id="main" class="page">
  <section class="view" id="view-today" data-view="today" hidden></section>
  <section class="view" id="view-calendar" data-view="calendar" hidden></section>
  <section class="view" id="view-analytics" data-view="analytics" hidden></section>
  <section class="view" id="view-preferences" data-view="preferences" hidden></section>
</main>

<div id="toast-root" class="toast-root" role="status" aria-live="polite" aria-atomic="true"></div>

<script src="vendor/chart.umd.js"></script>
<script src="js/core.js"></script>
<script src="js/icons.js"></script>
<script src="js/items.js"></script>
<script src="js/dates.js"></script>
<script src="js/store.js"></script>
<script src="js/components/modal.js"></script>
<script src="js/components/day-editor.js"></script>
<script src="js/components/day-modal.js"></script>
<script src="js/views/today.js"></script>
<script src="js/views/calendar.js"></script>
<script src="js/views/analytics.js"></script>
<script src="js/views/settings.js"></script>
<script src="js/app.js"></script>
<!-- BUILD:BODY-END -->
</body>
</html>
